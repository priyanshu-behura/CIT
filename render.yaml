# Render Blueprint Specification for CIT Campus Backend
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: cit-campus-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: CIT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: cit_campus
      - key: CORS_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173"
      - key: PYTHON_VERSION
        value: 3.12.0

